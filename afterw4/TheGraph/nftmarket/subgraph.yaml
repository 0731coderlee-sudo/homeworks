specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NFTMarket
    network: sepolia
    source:
      address: "0x543D6e9c9c7b1D9F5A21601EeBDC023B17fdB6DC"
      abi: NFTMarket
      startBlock: 9550031
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - List
        - BuyNFT
        - TokenAdded
        - TokenRemoved
      abis:
        - name: NFTMarket
          file: ./abis/NFTMarket.json
        - name: BaseERC721
          file: ./abis/BaseERC721.json
      eventHandlers:
        - event: Bought(indexed address,indexed uint256,address,uint256,address)
          handler: handleBought
        - event: Listed(indexed address,indexed uint256,address,uint256,address)
          handler: handleListed
        - event: TokenAdded(indexed address)
          handler: handleTokenAdded
        - event: TokenRemoved(indexed address)
          handler: handleTokenRemoved
      file: ./src/nft-market.ts
